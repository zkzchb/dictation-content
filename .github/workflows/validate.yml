name: Validate content packs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out content
        uses: actions/checkout@v7

      # Pin the validator used for content-v1.0.1. Update this only after a
      # compatible program release passes the same content-pack contract tests.
      - name: Check out pack validator
        uses: actions/checkout@v7
        with:
          repository: zkzchb/dictation
          ref: 8f0ad980049d0a0af3cf752b17f5313bc22684f9
          path: dictation

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate every published pack
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packs=(packs/*/*)
          test "${#packs[@]}" -gt 0
          for pack in "${packs[@]}"; do
            test -f "$pack/dataset.json"
            python dictation/shared/content_pack.py "$pack"
            DICTATION_CONTENT_ROOT="$GITHUB_WORKSPACE/$pack" \
              python dictation/shared/tools/audio_bundle.py verify-dataset \
              --content-root "$GITHUB_WORKSPACE/$pack"
          done
