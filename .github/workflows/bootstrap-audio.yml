name: Bootstrap published audio

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-audio.yml"

permissions:
  actions: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out content repository
        uses: actions/checkout@v7
        with:
          path: content

      - name: Check out verified audio source
        uses: actions/checkout@v7
        with:
          repository: zkzchb/dictation
          ref: main
          path: source

      - name: Copy and verify published audio
        shell: bash
        run: |
          set -euo pipefail
          target="content/packs/zh-cn/primary-3a"
          mkdir -p "$target/tts"
          cp -a source/chinese/3a/tts/. "$target/tts/"
          cd "$target"
          sha256sum --check tts.sha256
          test "$(find tts -type f -name '*.mp3' | wc -l)" -eq 894

      - name: Commit final content tree
        shell: bash
        working-directory: content
        run: |
          set -euo pipefail
          git rm .github/workflows/bootstrap-audio.yml
          sed -i '/bootstrap-audio/d' .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: publish primary-3a content pack"
          git push origin HEAD:main

      - name: Run final validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validate.yml --repo "$GITHUB_REPOSITORY" --ref main
